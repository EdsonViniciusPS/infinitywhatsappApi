# Bloco Nginx para incluir dentro de `http { ... }` no arquivo
# `/root/apps/lunaesolutionsback/nginx/nginx.conf` (container `lunae-nginx`).
#
# Substitua `api.seudominio.com.br` pelo subdomínio apontado para a VPS (ex: infinity-api.lunaesolutions.com.br).
#
# Ordem recomendada para emissão do certificado SSL pela primeira vez:
# 1. Adicione primeiro apenas o bloco `server` da porta 80 (HTTP + ACME challenge) e recarregue o `lunae-nginx`:
#      docker exec lunae-nginx nginx -t && docker exec lunae-nginx nginx -s reload
# 2. Emita o certificado via certbot usando o webroot compartilhado com o container `lunae-nginx`:
#      certbot certonly --webroot -w /root/apps/lunaesolutionsback/nginx/certbot/www -d api.seudominio.com.br
# 3. Adicione o bloco `server` da porta 443 abaixo e recarregue novamente o `lunae-nginx`:
#      docker exec lunae-nginx nginx -t && docker exec lunae-nginx nginx -s reload

server {
    listen 80;
    server_name api.seudominio.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.seudominio.com.br;

    ssl_certificate /etc/letsencrypt/live/api.seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.seudominio.com.br/privkey.pem;

    client_max_body_size 50M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # DNS interno do Docker para evitar falha do nginx caso o container da API reinicie
    resolver 127.0.0.11 valid=30s;

    location / {
        set $infinity_api_upstream http://infinity-whatsapp-api:8000;
        proxy_pass $infinity_api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
