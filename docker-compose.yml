x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: infinity-whatsapp-postgres
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infinity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
      POSTGRES_DB: ${POSTGRES_DB:-infinity_api}
      EVOLUTION_DB: ${EVOLUTION_DB:-evolution}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infinity} -d ${POSTGRES_DB:-infinity_api}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: infinity-whatsapp-redis
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --save 60 1
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-api:
    image: ${EVOLUTION_IMAGE:-evoapicloud/evolution-api:v2.3.7}
    container_name: infinity-whatsapp-evolution
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_OPTIONS: "--max-old-space-size=1024"
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_API_URL:-http://evolution-api:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-infinity}:${POSTGRES_PASSWORD:-change-me-db-password}@postgres:5432/${EVOLUTION_DB:-evolution}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://infinity-whatsapp-api:8000/api/v1/webhooks/evolution?secret=${EVOLUTION_WEBHOOK_SECRET}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: infinity-whatsapp-api
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_started
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - ./backups:/app/backups
    networks:
      internal: {}
      lunae-network:
        aliases:
          - infinity-whatsapp-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  backup:
    image: postgres:16-alpine
    container_name: infinity-whatsapp-backup
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infinity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
      POSTGRES_DB: ${POSTGRES_DB:-infinity_api}
      EVOLUTION_DB: ${EVOLUTION_DB:-evolution}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
    volumes:
      - ./backups:/backups
      - ./docker/backup/entrypoint.sh:/entrypoint.sh:ro
      - evolution_instances:/evolution/instances:ro
      - redis_data:/redis-data:ro
    networks:
      - internal

volumes:
  postgres_data:
    name: infinity_postgres_data
  redis_data:
    name: infinity_redis_data
  evolution_instances:
    name: infinity_evolution_instances

networks:
  internal:
    name: infinity_whatsapp_internal
    driver: bridge
  lunae-network:
    external: true
    name: ${DOCKER_EXTERNAL_NETWORK:-lunaesolutionsback_lunae-network}
